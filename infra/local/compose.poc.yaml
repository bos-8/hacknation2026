services:
  pyworker:
    networks: [workers, edge]
    environment:
      PYWORKER_FORM_MODE: agentcore
      PYWORKER_HARNESS_API_URL: "${PYWORKER_HARNESS_API_URL:?Set Harness API URL}"
      PYWORKER_HARNESS_API_KEY: "${PYWORKER_HARNESS_API_KEY:?Set Harness API key}"
      PYWORKER_HARNESS_EXPIRES_AT: "${PYWORKER_HARNESS_EXPIRES_AT}"
      EDENAI_TIMEOUT_SECONDS: "${EDENAI_TIMEOUT_SECONDS}"
      EDENAI_MAX_INPUT_CHARS: "${EDENAI_MAX_INPUT_CHARS}"
      EDENAI_MAX_OUTPUT_TOKENS: "${EDENAI_MAX_OUTPUT_TOKENS}"
      EDENAI_VISION_MODEL: "${EDENAI_VISION_MODEL}"
  maintenance:
    environment:
      NODE_OPTIONS: "--import=/app/scripts/qa-localhost.mjs"
      AUTH_BASE_URL: "${APP_PUBLIC_URL}"
      AUTH_ISSUER: "${AUTH_PUBLIC_URL}/realms/FORMIQ"
      AUTH_ADMIN_USERNAME: "${AUTH_ADMIN_USERNAME}"
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD}"
      POC_ADMIN_PASSWORD: "${POC_ADMIN_PASSWORD}"
      POC_USER_PASSWORD: "${POC_USER_PASSWORD}"
