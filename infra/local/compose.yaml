name: ${STACK_NAME:?Run pnpm stack:init}

x-service: &service
  labels: {org.formiq.environment: "${ENV_MODE:-dev}"}
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}", max-file: "${CONTAINER_LOG_MAX_FILE:-3}"}

services:
  s3console:
    <<: *service
    profiles: [tools]
    image: ${S3CONSOLE_IMAGE:-chrislusf/seaweedfs:4.51}
    container_name: ${STACK_NAME:?Required}-s3console-${INSTANCE_INDEX:-0}
    entrypoint: [/usr/bin/weed]
    command: [admin, -master=s3:9333, -ip=0.0.0.0, -port=8080, -port.legacy=0, -dataDir=/data/admin, -iceberg.port=0, -lance.port=0]
    user: "1000:1000"
    environment:
      WEED_ADMIN_USER: ${S3CONSOLE_ADMIN_USERNAME:-admin}
      WEED_ADMIN_PASSWORD: ${S3CONSOLE_ADMIN_PASSWORD:-}
      TZ: ${TZ:-Europe/Warsaw}
    ports: ["127.0.0.1:${S3CONSOLE_PORT:-8090}:8080"]
    networks: [edge]
    volumes: [s3console-data:/data]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    cap_drop: [ALL]
    cpus: ${S3CONSOLE_CPU_LIMIT:-0.5}
    mem_limit: ${S3CONSOLE_MEMORY_LIMIT:-128m}
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/login]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  db:
    <<: *service
    entrypoint: [sh, /bootstrap/start.sh]
    image: ${DB_IMAGE:-postgres:18.6-bookworm}
    container_name: ${STACK_NAME:?Required}-db-${INSTANCE_INDEX:-0}
    mem_limit: ${DB_MEMORY_LIMIT:-1g}
    cpus: ${DB_CPU_LIMIT:-1.0}
    command: [postgres, -c, "max_connections=${DB_MAX_CONNECTIONS:-100}"]
    environment:
      POSTGRES_USER: ${DB_ADMIN_USERNAME:?Required}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: ${DB_INIT_ARGS:---encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256}
      DB_APP_DATABASE_NAME: ${DB_APP_DATABASE_NAME:?Required}
      DB_APP_USERNAME: ${DB_APP_USERNAME:?Required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Required}
      DB_AUTH_DATABASE_NAME: ${DB_AUTH_DATABASE_NAME:?Required}
      DB_AUTH_USERNAME: ${DB_AUTH_USERNAME:?Required}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD:?Required}
      DB_APP_CONNECTION_LIMIT: ${DB_APP_CONNECTION_LIMIT:-40}
      DB_AUTH_CONNECTION_LIMIT: ${DB_AUTH_CONNECTION_LIMIT:-20}
      DB_QUEUE_DATABASE_NAME: ${DB_QUEUE_DATABASE_NAME:-formiq_queue}
      DB_QUEUE_USERNAME: ${DB_QUEUE_USERNAME:-formiq_queue}
      DB_QUEUE_PASSWORD: ${DB_QUEUE_PASSWORD:?Required}
      DB_QUEUE_CONNECTION_LIMIT: ${DB_QUEUE_CONNECTION_LIMIT:-12}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - type: bind
        source: ./postgres/init/init-databases.sh
        target: /bootstrap/init-databases.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./postgres/start.sh
        target: /bootstrap/start.sh
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./postgres/init/init-queue.sh
        target: /bootstrap/init-queue.sh
        read_only: true
        bind: {create_host_path: false}
    networks: [database]
    shm_size: ${DB_SHM_SIZE:-128m}
    stop_grace_period: 60s
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/modulon-postgres-ready && pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  auth:
    <<: *service
    image: ${AUTH_IMAGE:-formiq-keycloak:26.7.5-postgres}
    container_name: ${STACK_NAME:?Required}-auth-${INSTANCE_INDEX:-0}
    mem_limit: ${AUTH_MEMORY_LIMIT:-1g}
    cpus: ${AUTH_CPU_LIMIT:-2.0}
    build:
      context: ./keycloak
      args:
        KEYCLOAK_IMAGE: ${AUTH_BASE_IMAGE:-quay.io/keycloak/keycloak:26.7.5}
        NODE_IMAGE: ${NODE_IMAGE:-node:26.12.1-bookworm-slim}
    command: [start, --optimized]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${DB_AUTH_DATABASE_NAME:?Required}
      KC_DB_USERNAME: ${DB_AUTH_USERNAME:?Required}
      KC_DB_PASSWORD: ${DB_AUTH_PASSWORD:?Required}
      KC_DB_POOL_INITIAL_SIZE: ${AUTH_DB_POOL_INITIAL_SIZE:-1}
      KC_DB_POOL_MIN_SIZE: ${AUTH_DB_POOL_MIN_SIZE:-1}
      KC_DB_POOL_MAX_SIZE: ${AUTH_DB_POOL_MAX_SIZE:-15}
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:?Required}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?Required}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: ${AUTH_HTTP_ENABLED:-true}
      KC_HTTPS_CERTIFICATE_FILE: /run/tls/localhost.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/tls/localhost-key.pem
      KC_HTTPS_PORT: ${AUTH_LOCAL_PORT:?Required}
      KC_HOSTNAME: ${AUTH_PUBLIC_URL:?Required}
      KC_HOSTNAME_ADMIN: ${AUTH_ADMIN_PUBLIC_URL:?Required}
      KC_HOSTNAME_STRICT: ${AUTH_HOSTNAME_STRICT:-true}
      KC_HOSTNAME_DEBUG: ${AUTH_HOSTNAME_DEBUG:-false}
      KC_HTTP_MANAGEMENT_SCHEME: http
      AUTH_DIRECTORY_CLIENT_SECRET: ${AUTH_DIRECTORY_CLIENT_SECRET:?Required}
      AUTH_SESSION_IDLE_SECONDS: ${AUTH_SESSION_IDLE_SECONDS:-1800}
      AUTH_SESSION_MAX_SECONDS: ${AUTH_SESSION_MAX_SECONDS:-28800}
      FORMIQ_APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Required}
      FORMIQ_PREFERENCE_COOKIE_DOMAIN: ${UI_PREFERENCE_COOKIE_DOMAIN:-}
      FORMIQ_THEME_COOKIE_NAME: ${AUTH_THEME_COOKIE_NAME:-formiq_theme}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?Required}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Required}
    ports: ["127.0.0.1:${AUTH_LOCAL_PORT}:${AUTH_LOCAL_PORT}"]
    volumes:
      - ./keycloak/realms/formiq-realm.json:/opt/keycloak/data/import/formiq-realm.json:ro
      - ${CERTS_DIR:-./certs}/${TLS_CERT_PEM:-localhost.pem}:/run/tls/localhost.pem:ro
      - ${CERTS_DIR:-./certs}/${TLS_CERT_KEY:-localhost-key.pem}:/run/tls/localhost-key.pem:ro
    networks: [database, edge]
    depends_on:
      db: {condition: service_healthy}
    cap_drop: [ALL]
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'test -f /tmp/formiq-keycloak-ready; exec 3<>/dev/tcp/127.0.0.1/9000;
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q "200"'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  s3:
    <<: *service
    image: ${S3_IMAGE:-modulon-poc-seaweedfs:4.51}
    build:
      context: ./seaweedfs
      args:
        SEAWEEDFS_IMAGE: ${S3_BASE_IMAGE:-chrislusf/seaweedfs:4.51}
        NODE_IMAGE: ${S3_BOOTSTRAP_NODE_IMAGE:-node:26.12.1-alpine}
    container_name: ${STACK_NAME:?Required}-s3-${INSTANCE_INDEX:-0}
    mem_limit: ${S3_MEMORY_LIMIT:-1g}
    cpus: ${S3_CPU_LIMIT:-1.0}
    command: [mini, -dir=/data, -ip=s3, -ip.bind=0.0.0.0, -admin.ui=false, -s3.config=/config/s3.json, -s3.iam=false, -s3.port.iceberg=0, -s3.port.lance=0]
    ports: ["127.0.0.1:${S3_PORT:-8333}:8333"]
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?Required}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?Required}
      S3_APP_ACCESS_KEY: ${S3_APP_ACCESS_KEY:?Required}
      S3_APP_SECRET_KEY: ${S3_APP_SECRET_KEY:?Required}
      S3_BUCKET: ${S3_BUCKET:?Required}
      S3_AVATAR_BUCKET: ${S3_AVATAR_BUCKET:?Required}
      S3_AVATAR_ACCESS_KEY: ${S3_AVATAR_ACCESS_KEY:?Required}
      S3_AVATAR_SECRET_KEY: ${S3_AVATAR_SECRET_KEY:?Required}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ENDPOINT: http://127.0.0.1:8333
    volumes: [seaweed-data:/data]
    tmpfs: ["/config:rw,noexec,nosuid,size=1m,mode=0700"]
    networks: [edge]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/modulon-seaweed-ready && wget -q -O /dev/null http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s


networks:
  database:
  edge:
volumes:
  postgres-data:
    name: ${DB_VOLUME_NAME:-${STACK_NAME:?Required}-postgres}
  seaweed-data:
    name: ${S3_VOLUME_NAME:-${STACK_NAME:?Required}-seaweedfs}
  s3console-data:
    name: ${S3CONSOLE_VOLUME_NAME:-${STACK_NAME:?Required}-s3console}
